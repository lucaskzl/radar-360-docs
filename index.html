<style>
:root{color-scheme:light;--paper:#f7f8fa;--white:#fff;--ink:#121a27;--muted:#657080;--soft:#8a94a2;--line:#dfe4ea;--accent:#174a83;--radius:10px;--content:1040px}
:root[data-theme="dark"]{color-scheme:dark;--paper:#0d1117;--white:#151b24;--ink:#edf2f7;--muted:#9aa5b4;--soft:#758191;--line:#252e3c;--accent:#5ca0eb}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:18px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .2s ease,color .2s ease}
a{color:inherit}
.site-shell{width:min(var(--content),calc(100% - 56px));margin:0 auto}
.site-header{min-height:74px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.monogram{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;border:1px solid #cbd4df;border-radius:50%;color:var(--accent);text-decoration:none;font-size:13px;font-weight:750;letter-spacing:-.05em}
:root[data-theme="dark"] .monogram{border-color:#2e3a4b}
.header-name{font-size:13px;font-weight:650;letter-spacing:-.01em}
.theme-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--white);color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:border-color .15s ease,color .15s ease,background-color .15s ease}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:14px;height:14px;flex:0 0 14px}
.intro{padding:54px 0 42px;max-width:710px}
.intro h1{margin:0;font-size:clamp(43px,7vw,70px);font-weight:680;line-height:1.02;letter-spacing:-.075em}
.intro h1 span{color:var(--accent)}
.intro-rule{display:flex;gap:5px;margin-top:25px}.intro-rule span{display:block;width:26px;height:3px;border-radius:5px;background:var(--accent)}.intro-rule span:nth-child(2){width:11px;opacity:.45}.intro-rule span:nth-child(3){width:5px;opacity:.2}
.content-section{padding:26px 0 56px;border-top:1px solid var(--line)}
.section-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;gap:16px}
.eyebrow{margin:0;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.14em;line-height:1.5}
.section-heading h2{margin:6px 0 0;font-size:27px;font-weight:650;letter-spacing:-.05em;line-height:1.2}
.section-count{color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}
.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:14px}
.credential-card{min-width:0;min-height:222px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);transition:background-color .2s ease,border-color .2s ease}
.credential-main{min-width:0;flex:1}.card-topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.type-label{display:inline-block;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.card-date{color:var(--soft);font-size:11px;white-space:nowrap}
.credential-card h3{margin:13px 0 3px;font-size:18px;line-height:1.3;font-weight:670;letter-spacing:-.035em}.issuer{margin:0;color:var(--muted);font-size:12px}.course-details{margin:11px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.qr-wrap{display:flex;flex:0 0 106px;flex-direction:column;align-items:center;gap:7px;margin:auto 0}.qr-wrap img{display:block;width:106px;height:106px;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff}.qr-wrap span{max-width:112px;color:var(--soft);font-size:7px;font-weight:800;letter-spacing:.08em;text-align:center;line-height:1.4}
.document-tile{width:106px;min-height:106px;display:flex;flex:0 0 106px;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin:auto 0;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;text-align:center;text-decoration:none}.document-tile svg{width:28px;height:28px;color:var(--accent)}.document-tile strong{font-size:8px;letter-spacing:.08em;color:var(--ink)}.document-tile small{font-size:7px;line-height:1.35;color:var(--soft);letter-spacing:.04em}.document-tile.is-ready{border-color:#cbd8e5;background:#f8fbff}.document-tile.is-ready:hover{border-color:var(--accent)}
:root[data-theme="dark"] .document-tile{background:#1a222d}
:root[data-theme="dark"] .document-tile.is-ready{border-color:#2d435e;background:#182433}
.credential-code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:10px;border-top:1px solid #edf0f3}.credential-code>span{display:grid;min-width:0;gap:3px}.credential-code small{color:var(--soft);font-size:8px;font-weight:750;letter-spacing:.1em}.credential-code code{overflow-wrap:anywhere;color:#515d6d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}.copy-button{flex:0 0 auto;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted);font:inherit;font-size:10px;cursor:pointer}.copy-button:hover{border-color:#b8c8d9;color:var(--accent)}
:root[data-theme="dark"] .credential-code{border-top-color:#202835}
:root[data-theme="dark"] .credential-code code{color:#b8c2cf}
:root[data-theme="dark"] .copy-button{background:#1a222d}
:root[data-theme="dark"] .copy-button:hover{border-color:#446182}
.course-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:10px;line-height:1.5}.course-meta i{width:3px;height:3px;flex:0 0 3px;border-radius:50%;background:#aab3bd}.period-note{margin:6px 0 0;color:var(--soft);font-size:10px}
:root[data-theme="dark"] .course-meta i{background:#4a5565}
.card-actions{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:12px}.validation-link,.certificate-link{display:inline-flex;gap:5px;align-items:center;color:var(--accent);font-size:11px;font-weight:700;text-decoration:none}.certificate-link{color:#526273}.validation-link:hover,.certificate-link:hover{ text-decoration:underline }
:root[data-theme="dark"] .certificate-link{color:#9cb0c4}
.toast{position:fixed;left:50%;bottom:22px;z-index:10;transform:translate(-50%,12px);padding:9px 14px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}.toast.show{transform:translate(-50%,0);opacity:1}
:root[data-theme="dark"] .toast{background:#e2e8f0;color:#0d1117}
@media(max-width:760px){.site-shell{width:min(100% - 36px,var(--content))}.site-header{min-height:66px}.intro{padding:48px 0 34px}.intro h1{font-size:clamp(43px,12vw,64px)}.course-grid{grid-template-columns:1fr}}
@media(max-width:480px){.site-shell{width:calc(100% - 30px)}.header-name{font-size:12px}.monogram{width:37px;height:37px;flex-basis:37px}.theme-toggle{padding:5px 9px;font-size:10px}.credential-card{min-height:190px;padding:15px;gap:10px}.qr-wrap,.document-tile{flex-basis:78px;width:78px}.qr-wrap img{width:78px;height:78px}.qr-wrap span{font-size:6px}.document-tile{min-height:78px;padding:5px}.document-tile svg{width:22px;height:22px}.document-tile strong{font-size:7px}.document-tile small{font-size:6px}.card-topline{align-items:start;flex-direction:column;gap:3px}.section-heading h2{font-size:23px}}
@media print{body{background:#fff!important;color:#121a27!important}.site-shell{width:100%}.copy-button,.toast,.theme-toggle{display:none!important}.credential-card{break-inside:avoid;background:#fff!important}}
</style>

const grid = document.getElementById('credentials-grid');
const count = document.getElementById('credential-count');
const toast = document.getElementById('toast');
const escapeHTML = (value='') => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function iconDocument() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>';
}
function renderMeta(course) {
  const items = [];
  if (course.hours) items.push(course.hours);
  if (course.score) items.push(course.score);
  if (course.validity) items.push(course.validity);
  return items.length ? '<div class="course-meta">' + items.map((item,i) => (i ? '<i aria-hidden="true"></i>' : '') + '<span>' + escapeHTML(item) + '</span>').join('') + '</div>' : '';
}
function renderCode(course) {
  if (!course.code) return '';
  return `<div class="credential-code"><span><small>CÓDIGO / ID</small><code>${escapeHTML(course.code)}</code></span><button class="copy-button" type="button" data-copy="${escapeHTML(course.code)}" aria-label="Copiar código do certificado">Copiar</button></div>`;
}
function renderMedia(course) {
  if (course.qr) return `<div class="qr-wrap"><img src="${course.qr}" alt="QR Code para ${escapeHTML(course.qrLabel || course.name)}" width="106" height="106"><span>${escapeHTML(course.qrLabel || 'ESCANEIE PARA CONSULTAR')}</span></div>`;
  if (course.pdfAvailable) return `<a class="document-tile is-ready" href="${escapeHTML(course.certificateFile)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir certificado em PDF">${iconDocument()}<strong>ABRIR PDF</strong><small>CERTIFICADO</small></a>`;
  return `<div class="document-tile" aria-label="Certificado PDF ainda não adicionado">${iconDocument()}<strong>PDF A ADICIONAR</strong><small>ARQUIVO NA PASTA CERTIFICADOS</small></div>`;
}
function renderActions(course) {
  const links = [];
  if (course.validationUrl) links.push(`<a class="validation-link" href="${escapeHTML(course.validationUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(course.validationLabel || 'Consultar credencial')} <span aria-hidden="true">↗</span></a>`);
  if (course.moduleUrl) links.push(`<a class="validation-link" href="${escapeHTML(course.moduleUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(course.moduleLabel || 'Consultar módulo')} <span aria-hidden="true">↗</span></a>`);
  if (course.qr && course.pdfAvailable) links.push(`<a class="certificate-link" href="${escapeHTML(course.certificateFile)}" target="_blank" rel="noopener noreferrer">Abrir certificado PDF ↗</a>`);
  return links.length ? `<div class="card-actions">${links.join('')}</div>` : '';
}
function renderCard(course) {
  return `<article class="credential-card"><div class="credential-main"><div class="card-topline"><span class="type-label">${escapeHTML(course.badge || 'CREDENCIAL DIGITAL')}</span><span class="card-date">${escapeHTML(course.date || '')}</span></div><h3>${escapeHTML(course.name)}</h3><p class="issuer">${escapeHTML(course.issuer)}</p>${course.details ? `<p class="course-details">${escapeHTML(course.details)}</p>` : ''}${renderMeta(course)}${course.period ? `<p class="period-note">${escapeHTML(course.period)}</p>` : ''}${renderCode(course)}${renderActions(course)}</div>${renderMedia(course)}</article>`;
}
async function pdfExists(path) {
  if (!path || location.protocol === 'file:') return false;
  try { const response = await fetch(path, { method: 'HEAD', cache: 'no-store' }); return response.ok; }
  catch { return false; }
}
async function initialize() {
  await Promise.all(credentials.map(async course => {
    const candidates = [course.certificateFile, ...(course.altFiles || [])].filter(Boolean);
    for (const file of candidates) {
      if (await pdfExists(file)) { course.certificateFile = file; course.pdfAvailable = true; break; }
    }
  }));
  grid.innerHTML = credentials.map(renderCard).join('');
  count.textContent = String(credentials.length).padStart(2,'0');
}
initialize();
let toastTimer;
function showToast(message) { toast.textContent = message; toast.classList.add('show'); window.clearTimeout(toastTimer); toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1700); }
document.addEventListener('click', async event => {
  const button = event.target.closest('[data-copy]');
  if (!button) return;
  const value = button.getAttribute('data-copy');
  try { await navigator.clipboard.writeText(value); showToast('Código copiado.'); }
  catch {
    const field = document.createElement('textarea'); field.value = value; field.style.position = 'fixed'; field.style.opacity = '0'; document.body.appendChild(field); field.select();
    const ok = document.execCommand('copy'); field.remove(); showToast(ok ? 'Código copiado.' : 'Não foi possível copiar automaticamente.');
  }
});

const themeToggle = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
const themeLabel = document.getElementById('theme-label');
const themeMeta = document.querySelector('meta[name="theme-color"]');
const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';

function syncThemeUI(isDark) {
  themeToggle.setAttribute('aria-pressed', String(isDark));
  themeToggle.setAttribute('aria-label', isDark ? 'Ativar modo claro' : 'Ativar modo noturno');
  themeLabel.textContent = isDark ? 'Modo claro' : 'Modo noturno';
  themeIcon.innerHTML = isDark ? sunPath : moonPath;
  if (themeMeta) themeMeta.setAttribute('content', isDark ? '#0d1117' : '#f7f8fa');
}

syncThemeUI(document.documentElement.getAttribute('data-theme') === 'dark');

themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'dark';
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  }
  syncThemeUI(isDark);
});
</script>
